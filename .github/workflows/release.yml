name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-13
            target: x86_64-apple-darwin
            asset_name: header42-lsp-x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
            asset_name: header42-lsp-aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: header42-lsp-x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: header42-lsp-aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: header42-lsp-x86_64-pc-windows-msvc.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build LSP binary
        run: |
          cargo build --release --target ${{ matrix.target }} -p header42-lsp

      - name: Rename binary for release
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            mv target/${{ matrix.target }}/release/header42-lsp.exe target/${{ matrix.target }}/release/${{ matrix.asset_name }}
          else
            mv target/${{ matrix.target }}/release/header42-lsp target/${{ matrix.target }}/release/${{ matrix.asset_name }}
          fi

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.asset_name }}
