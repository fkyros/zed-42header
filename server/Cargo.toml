[package]
name = "header42-lsp"
version = "0.1.1"
edition = "2021"
authors = ["gade-oli <gade-oli@student.42madrid.com>"]
description = "Language Server Protocol for 42 standard headers (Community port for Zed Editor)"
license = "MIT"
repository = "https://github.com/fkyros/zed-42header"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tower-lsp = "0.20.0"
chrono = "0.4.38"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10.5"

[dev-dependencies]
tokio-test = "0.4.4"
